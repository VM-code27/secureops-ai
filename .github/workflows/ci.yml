name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Evaluate on real labelled data (UWF-ZeekData24, held-out days)
        run: python -m secureops.evaluate > evaluation.md
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: |
            evaluation.md
            reports/metrics.json
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t secureops-ai .
      - name: Validate sensor kit
        run: cp sensor/.env.example sensor/.env && docker compose -f sensor/docker-compose.yml config -q
