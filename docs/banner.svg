<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8fe"/>
      <stop offset="1" stop-color="#e6effb"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a78d6" stop-opacity="0"/>
      <stop offset="1" stop-color="#2a78d6" stop-opacity=".35"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <!-- radar -->
  <g transform="translate(1080,170)">
    <circle r="130" fill="#ffffff" stroke="#cfe0f6" stroke-width="2"/>
    <circle r="90" fill="none" stroke="#cfe0f6" stroke-width="2"/>
    <circle r="50" fill="none" stroke="#cfe0f6" stroke-width="2"/>
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#e3ecf8"/>
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#e3ecf8"/>
    <path d="M0 0 L0 -130 A130 130 0 0 1 112 -66 Z" fill="url(#sweep)"/>
    <line x1="0" y1="0" x2="0" y2="-130" stroke="#2a78d6" stroke-width="3"/>
    <circle cx="62" cy="-78" r="8" fill="#d03b3b"/><circle cx="62" cy="-78" r="16" fill="none" stroke="#d03b3b" stroke-opacity=".35" stroke-width="4"/>
    <circle cx="-70" cy="40" r="7" fill="#eda100"/>
    <circle cx="35" cy="70" r="6" fill="#1baf7a"/>
    <circle cx="-40" cy="-60" r="5" fill="#1baf7a"/>
    <circle r="7" fill="#2a78d6"/>
  </g>
  <!-- logo + title -->
  <g transform="translate(64,62) scale(3.2)">
    <path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5l8-3z" fill="#2a78d6"/>
    <path d="M8.5 12.2l2.3 2.3 4.7-4.9" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="160" y="118" font-size="54" font-weight="700" fill="#0b0b0b">SecureOps AI</text>
  <text x="64" y="178" font-size="25" fill="#2f2f2d">Real-time threat detection, alert correlation and</text>
  <text x="64" y="212" font-size="25" fill="#2f2f2d">evidence-cited AI investigation on real network telemetry</text>
  <!-- chips -->
  <g font-size="16" font-weight="600">
    <g transform="translate(64,250)"><rect width="150" height="40" rx="20" fill="#fff" stroke="#2a78d6"/><text x="75" y="26" text-anchor="middle" fill="#2a78d6">Zeek · Suricata</text></g>
    <g transform="translate(226,250)"><rect width="164" height="40" rx="20" fill="#fff" stroke="#eb6834"/><text x="82" y="26" text-anchor="middle" fill="#c4521f">MITRE ATT&amp;CK</text></g>
    <g transform="translate(402,250)"><rect width="186" height="40" rx="20" fill="#fff" stroke="#1baf7a"/><text x="93" y="26" text-anchor="middle" fill="#127a55">Isolation Forest ML</text></g>
    <g transform="translate(600,250)"><rect width="208" height="40" rx="20" fill="#fff" stroke="#6250d6"/><text x="104" y="26" text-anchor="middle" fill="#6250d6">LLM + citation checks</text></g>
  </g>
</svg>
